<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>經典掃地雷 Minesweeper | 黃映瑄 Ying-Hsuan</title>
    <meta name="description" content="用 HTML5、CSS 與 JavaScript 打造的現代化網頁版掃地雷小遊戲。具備響應式設計、流暢動態與優雅的暗色玻璃擬態風格。" />
    <meta name="keywords" content="黃映瑄, 掃地雷, 網頁遊戲, HTML5遊戲, JavaScript 遊戲" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        html,
        body {
            overflow: hidden;
            touch-action: manipulation;
        }
    </style>
</head>

<body>
    <div class="game-container">
        <!-- Control Panel -->
        <div class="control-panel">
            <h1 class="panel-title">Minesweeper</h1>

            <div class="controls-group">
                <select id="level-select" onchange="changeLevel(this.value)">
                    <option value="easy">初級 (10x10)</option>
                    <option value="medium">中級 (16x16)</option>
                    <option value="hard">高級 (30x16)</option>
                </select>
            </div>

            <div id="status" class="status-badge">🚩 10</div>

            <div class="flex gap-2">
                <button onclick="init()" id="btn-reset">重設</button>
                <a href="../index.html" class="btn-home" id="btn-home">回首頁</a>
            </div>
        </div>

        <!-- Board Area -->
        <div id="board-container" class="board-container">
            <div id="board" class="mines-board"></div>
        </div>

        <!-- Status Message -->
        <div id="msg" class="status-message text-slate-200"></div>
    </div>

    <script>
        const LEVELS = {
            easy: { rows: 10, cols: 10, mines: 10 },
            medium: { rows: 16, cols: 16, mines: 40 },
            hard: { rows: 16, cols: 30, mines: 99 }
        };

        let currentLevel = 'easy';
        let ROWS = LEVELS.easy.rows, COLS = LEVELS.easy.cols, MINES = LEVELS.easy.mines;
        let board = [], flags = 0, gameOver = false, firstClick = true;

        const boardElement = document.getElementById('board');
        const boardContainer = document.getElementById('board-container');
        const statusElement = document.getElementById('status');
        const msgElement = document.getElementById('msg');

        // Curated neon-like colors for dark theme numbers
        const colors = [
            '', 
            'text-blue-400 font-extrabold', 
            'text-emerald-400 font-extrabold', 
            'text-rose-400 font-extrabold', 
            'text-purple-400 font-extrabold', 
            'text-amber-400 font-extrabold', 
            'text-teal-400 font-extrabold', 
            'text-pink-400 font-extrabold', 
            'text-indigo-400 font-extrabold'
        ];

        function changeLevel(level) {
            currentLevel = level;
            ROWS = LEVELS[level].rows;
            COLS = LEVELS[level].cols;
            MINES = LEVELS[level].mines;
            init();
        }

        function placeMine(firstR, firstC) {
            let count = 0;
            while (count < MINES) {
                let r = Math.floor(Math.random() * ROWS);
                let c = Math.floor(Math.random() * COLS);
                if (!board[r][c].mine && !(Math.abs(r - firstR) <= 1 && Math.abs(c - firstC) <= 1)) {
                    board[r][c].mine = true;
                    count++;
                }
            }
        }

        function toggleFlag(r, c, cell) {
            if (gameOver || board[r][c].rev) return;
            board[r][c].flag = !board[r][c].flag;
            cell.innerText = board[r][c].flag ? '🚩' : '';
            if (board[r][c].flag) {
                cell.classList.add('flagged');
            } else {
                cell.classList.remove('flagged');
            }
            flags += board[r][c].flag ? 1 : -1;
            statusElement.innerHTML = `🚩 ${MINES - flags}`;
        }

        function getMines(r, c) {
            let count = 0;
            for (let i = -1; i <= 1; i++) {
                for (let j = -1; j <= 1; j++) {
                    if (board[r + i]?.[c + j]?.mine) count++;
                }
            }
            return count;
        }

        function checkWin() {
            let unrevealed = 0;
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (!board[r][c].rev) unrevealed++;
                }
            }

            if (unrevealed === MINES && !gameOver) {
                msgElement.innerText = '恭喜過關! 🎉';
                msgElement.className = 'status-message text-emerald-400 animate-bounce';
                gameOver = true;

                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        if (board[r][c].mine && !board[r][c].flag) {
                            const targetCell = boardElement.children[r * COLS + c];
                            targetCell.innerText = '🚩';
                            targetCell.classList.add('flagged');
                        }
                    }
                }
                statusElement.innerHTML = `🚩 0`;
            }
        }

        function clickCell(r, c, cell) {
            if (gameOver || board[r][c].flag || board[r][c].rev) return;

            if (firstClick) {
                placeMine(r, c);
                firstClick = false;
            }

            board[r][c].rev = true;
            cell.classList.add('revealed');

            if (board[r][c].mine) {
                cell.innerText = '💣';
                cell.classList.add('mine');
                msgElement.innerText = '遊戲結束! 💥';
                msgElement.className = 'status-message text-rose-500 animate-pulse';
                gameOver = true;
                revealAllMines();
                return;
            }

            let mines = getMines(r, c);
            if (mines > 0) {
                cell.innerText = mines;
                cell.className = `cell revealed ${colors[mines]} w-full h-full`;
            } else {
                for (let i = -1; i <= 1; i++) {
                    for (let j = -1; j <= 1; j++) {
                        let nr = r + i, nc = c + j;
                        if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                            if (!board[nr][nc].rev) {
                                clickCell(nr, nc, boardElement.children[nr * COLS + nc]);
                            }
                        }
                    }
                }
            }
            checkWin();
        }

        function revealAllMines() {
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const idx = r * COLS + c;
                    const targetCell = boardElement.children[idx];
                    if (board[r][c].mine) {
                        if (!board[r][c].flag) {
                            targetCell.innerText = '💣';
                            if (!board[r][c].rev) targetCell.classList.add('mine-revealed');
                        }
                    } else if (board[r][c].flag) {
                        targetCell.innerText = '❌';
                        targetCell.classList.remove('flagged');
                        targetCell.classList.add('text-rose-500');
                    }
                }
            }
        }

        function resizeBoard() {
            const containerWidth = boardContainer.clientWidth - 24;
            const containerHeight = boardContainer.clientHeight - 24;

            const cellWidth = containerWidth / COLS;
            const cellHeight = containerHeight / ROWS;
            const cellSize = Math.floor(Math.min(cellWidth, cellHeight));

            boardElement.style.width = `${cellSize * COLS}px`;
            boardElement.style.height = `${cellSize * ROWS}px`;

            const cells = boardElement.querySelectorAll('.cell');
            cells.forEach(cell => {
                cell.style.fontSize = `${cellSize * 0.55}px`;
            });
        }

        function init() {
            boardElement.innerText = '';
            boardElement.className = `grid mines-board mx-auto`;
            boardElement.style.gridTemplateColumns = `repeat(${COLS}, minmax(0, 1fr))`;
            boardElement.style.gridTemplateRows = `repeat(${ROWS}, minmax(0, 1fr))`;

            board = Array.from({ length: ROWS }, () => Array.from({ length: COLS }, () => ({ mine: false, rev: false, flag: false })));
            flags = 0; gameOver = false; firstClick = true;
            statusElement.innerText = `🚩 ${MINES}`;
            msgElement.innerText = '';
            msgElement.className = 'status-message text-slate-200';

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell w-full h-full';
                    cell.oncontextmenu = (e) => { e.preventDefault(); toggleFlag(r, c, cell); };
                    cell.onclick = () => clickCell(r, c, cell);
                    boardElement.appendChild(cell);
                }
            }

            resizeBoard();
        }

        window.addEventListener('resize', resizeBoard);
        init();
    </script>
</body>

</html>
